<!DOCTYPE html>
<html>
<head>
  <title>On5Bank - Credit Card Application</title>
  <link rel="stylesheet" type="text/css" href="applystl.css">
</head>
<body>
  <header>
    <div class="logo">
      <img src="ON-removebg-preview.png" alt="On5Bank Logo">
    </div>
    <nav class="navbar">
      <ul>
        <li><a href="home.html" aria-hidden="true"></i>Dashboard</a></li>
        <li><a href="product.html" class="active">Products</a></li>
      </ul>
    </nav>
  </header>
  
  <section class="credit-card-application">
    <h1>Credit Card Application</h1>
    <form action="submit_application.php" method="POST">
      <label for="full-name">Full Name:</label>
      <input type="text" id="full-name" name="full-name" required>

      <label for="email">Email:</label>
      <input type="email" id="email" name="email" required>

      <label for="phone">Phone:</label>
      <input type="tel" id="phone" name="phone" required>

      <label for="address">Address:</label>
      <textarea id="address" name="address" required></textarea>

      <label for="income">Annual Income:</label>
      <input type="number" id="income" name="income"min="4500" required>

      <label for="employment">Employment Status:</label>
      <select id="employment" name="employment" required>
        <option value="">Select</option>
        <option value="employed">Employed</option>
        <option value="self-employed">Self-employed</option>
        <option value="unemployed">Unemployed</option>
      </select>

      <label for="credit-score">Credit Score:</label>
      <input type="number" id="credit-score" name="credit-score" required>

      <input type="submit" value="Submit Application" class="cta-button">
    </form>
  </section>
</body>
</html>
